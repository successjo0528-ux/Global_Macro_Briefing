name: Daily Global Macro Crawler & Auto Deploy

on:
  workflow_dispatch: # cron-job.org 외부 Webhook 및 GitHub 수동 실행

# 중복 실행 방지 및 이전 진행 중인 작업 자동 취소
concurrency:
  group: global-macro-crawler
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  crawl_and_update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Global Macro Crawler Pipeline
        run: |
          python crawler_runner.py

      - name: Commit and Push latest briefing data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/briefing_data.json briefing_data.json data/data.js data.js
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit."
          else
            git commit -m "🤖 [자동 갱신] 글로벌 매크로 지표 & 경제 뉴스 브리핑 ($(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST'))"
            git pull --rebase origin main || true
            git push origin main
          fi
